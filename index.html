<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistema de Gestión</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f3f4f6;
      padding: 20px 16px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 400px;
    }
    h1 {
      text-align: center;
      color: #1f2937;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }
    p.subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 0.95rem;
      margin-top: 0;
      margin-bottom: 28px;
    }
    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .btn-menu {
      display: flex;
      align-items: center;
      gap: 16px;
      background: white;
      padding: 18px 20px;
      border-radius: 14px;
      text-decoration: none;
      color: #111827;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      transition: transform 0.1s ease;
    }
    .btn-menu:active {
      transform: scale(0.97);
    }
    .btn-icon {
      font-size: 2rem;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
      border-radius: 12px;
    }
    .btn-text {
      display: flex;
      flex-direction: column;
    }
    .btn-title {
      font-size: 1.1rem;
      font-weight: bold;
    }
    .btn-desc {
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>💅 Salón de Belleza</h1>
    <p class="subtitle">Panel de Control General</p>

    <div class="menu-grid">
      <!-- BOTÓN REGISTRO DE DEUDAS -->
      <a href="deudas.html" class="btn-menu">
        <div class="btn-icon">📋</div>
        <div class="btn-text">
          <span class="btn-title">Registro de Deudas</span>
          <span class="btn-desc">Gestiona cobros y envía mensajes</span>
        </div>
      </a>

      <!-- BOTÓN INVENTARIO -->
      <a href="inventario.html" class="btn-menu">
        <div class="btn-icon">💄</div>
        <div class="btn-text">
          <span class="btn-title">Inventario y Productos</span>
          <span class="btn-desc">Control de stock y ventas de insumos</span>
        </div>
      </a>

      <!-- BOTÓN RESPALDOS -->
      <a href="respaldos.html" class="btn-menu">
        <div class="btn-icon">⚙️</div>
        <div class="btn-text">
          <span class="btn-title">Respaldos de Seguridad</span>
          <span class="btn-desc">Exportar e importar archivos .json</span>
        </div>
      </a>
    </div>
  </div>

</body>
</html>
