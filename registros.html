<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Respaldos de Seguridad</title>
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f3f4f6;
      padding: 12px;
      margin: 0;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 { color: #1f2937; font-size: 1.3rem; margin: 0; }
    .btn-link {
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .card {
      background: white;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    p { color: #4b5563; font-size: 0.9rem; line-height: 1.4; }
    button, .label-file {
      display: block;
      width: 100%;
      text-align: center;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-sizing: border-box;
    }
    .btn-exportar { background: #059669; }
    .label-file { background: #d97706; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>⚙️ Respaldos de Seguridad</h1>
    <a href="index.html" class="btn-link">⬅️ Inicio</a>
  </div>

  <div class="card">
    <h3>Descargar Copia de Seguridad</h3>
    <p>Guarda un archivo <code>.json</code> con tus <b>deudas e inventario</b> juntos para proteger tus datos.</p>
    <button class="btn-exportar" onclick="exportarJSON()">📥 Descargar Respaldo Completo</button>
  </div>

  <div class="card">
    <h3>Restaurar desde Respaldo</h3>
    <p>Carga un archivo <code>.json</code> guardado. <b>Atención:</b> reemplazará los datos actuales.</p>
    
    <label for="archivoImportar" class="label-file">📤 Seleccionar Archivo JSON</label>
    <input type="file" id="archivoImportar" accept=".json" onchange="importarJSONAuto(this)">
  </div>

<script>
  // Configuración compartida de IndexedDB (Versión 2 con Deudas y Productos)
  const db = new Dexie("DeudasAppDB");
  db.version(2).stores({
    deudas: '++id, &nombre, cantidad, fecha, descripcion',
    productos: '++id, &nombre, precioCompra, precioVenta, cantidad, vendidos'
  });

  // Exporta Deudas + Productos en un único archivo
  async function exportarJSON() {
    const deudas = await db.deudas.toArray();
    const productos = await db.productos.toArray();

    if (deudas.length === 0 && productos.length === 0) {
      alert("No hay datos registrados para exportar.");
      return;
    }

    const copiaCompleta = {
      deudas: deudas,
      productos: productos
    };

    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(copiaCompleta, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `respaldo_salon_${new Date().toISOString().slice(0, 10)}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  // Importa y restaura ambas tablas
  function importarJSONAuto(inputElement) {
    const archivo = inputElement.files[0];
    if (!archivo) return;

    const lector = new FileReader();
    lector.onload = async function(e) {
      try {
        const datos = JSON.parse(e.target.result);

        if (datos.deudas || datos.productos) {
          if (confirm("¿Deseas restaurar este respaldo? Reemplazará los datos actuales del sistema.")) {
            if (datos.deudas) {
              await db.deudas.clear();
              const deudasLimpias = datos.deudas.map(({ id, ...resto }) => resto);
              await db.deudas.bulkAdd(deudasLimpias);
            }
            if (datos.productos) {
              await db.productos.clear();
              const productosLimpios = datos.productos.map(({ id, ...resto }) => resto);
              await db.productos.bulkAdd(productosLimpios);
            }

            alert("¡Sistema restaurado correctamente! ✅");
            window.location.href = "index.html";
          }
        } else {
          alert("El archivo cargado no contiene un formato de respaldo válido.");
        }
      } catch (err) {
        alert("Error al procesar el archivo: " + err.message);
      }
    };

    lector.readAsText(archivo);
  }
</script>
</body>
</html>
